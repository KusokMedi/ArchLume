[workspace]
resolver = "2"
members = ["compositor"]

[workspace.package]
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
bitflags = "2.2.1"
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
] }
